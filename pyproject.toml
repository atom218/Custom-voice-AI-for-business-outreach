[project]
name = "voice-ai-reachout"
version = "0.1.0"
description = "Provider-agnostic, telephony-ready outbound voice AI agent built on Pipecat."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["reachout"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
